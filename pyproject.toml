[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4.0", "mujoco==3.5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vkmujoco"
version = "0.1.0"
description = "MuJoCo-compatible batched GPU physics on Vulkan (MKX backend) with nanobind bindings"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "mujoco==3.5.0",
    "numpy>=1.26.4",
]

[tool.scikit-build]
wheel.packages = ["python/vkmujoco"]
wheel.py-api = "cp312"  # 3.12+はabi3 wheel、3.10/3.11はバージョン別wheel
wheel.exclude = ["include/**", "lib/**", "lib64/**"]  # mlx_vulkan経由のdoctest等のinstall物を除外
minimum-version = "build-system.requires"
build-dir = "build/skbuild/{wheel_tag}"
sdist.include = ["extern/mlx_vulkan"]

[tool.scikit-build.cmake.define]
MJMLX_BUILD_PYTHON = "ON"
MJMLX_BUILD_TESTS = "OFF"
MJMLX_BUILD_BENCHMARKS = "OFF"
MJMLX_BUILD_EXAMPLES = "OFF"

[dependency-groups]
# 学習・評価スクリプト(scripts/examples/)用
train = [
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "torch>=2.3.1",
    "tensorboard==2.16.2",
    "setuptools<81",  # tensorboard==2.16.2がpkg_resourcesに依存(setuptools>=81で削除)
    "pillow",
]
# rsl-rl-lib>=5はtorch>=2.6.0が必須(trainのtorch>=2.3.1と両立する範囲)
go2 = [
    "rsl-rl-lib>=5.0.0,<6",
    "tensordict>=0.7.0",
    "gitpython",
]
lint = [
    "ruff",
    "mypy",
    "numpy",
]

[tool.uv]
default-groups = ["train", "lint"]

[tool.ruff]
line-length = 200  # 既存スクリプトが長い行を使っている
target-version = "py310"
extend-exclude = ["python/vkmujoco/_core.pyi", "extern", "build*", "runs", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # sys.path操作の後のimport
    "F841",  # 既存スクリプトの未使用ローカル変数
    "E501",
    "E731", "E741", "E701", "E702",
]

[tool.mypy]
files = ["python/vkmujoco"]
strict = true
