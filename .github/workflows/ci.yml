name: CI

on:
  push:
    branches: [main]
  pull_request:

# ローカルと同じ scripts/Dockerfile (Debian bookworm + lavapipe) で実行する
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CI image
        run: docker build -f scripts/Dockerfile -t mjmlx-ci .

      - name: Run tests
        run: docker run --rm -v "$PWD":/work mjmlx-ci
