name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install just
        run: brew install just

      - name: Install MLX
        run: brew install mlx

      - name: Install MuJoCo (Python)
        run: |
          pip install mujoco==3.5.0
          echo "MUJOCO_ROOT=$(python3 -c 'import mujoco, os; print(os.path.dirname(mujoco.__file__))')" >> "$GITHUB_ENV"

      - name: Build
        run: just build
        env:
          MLX_ROOT: /opt/homebrew/opt/mlx

      - name: Run tests
        run: just check-ci
        env:
          MLX_ROOT: /opt/homebrew/opt/mlx

  build-mkx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up SSH deploy key for mlx-cross-platform (private repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MKX_DEPLOY_KEY }}

      - name: Install Vulkan (lavapipe) and glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y vulkan-tools mesa-vulkan-drivers libvulkan-dev glslang-tools

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install MuJoCo (Python)
        run: |
          pip install mujoco==3.5.0
          echo "MUJOCO_ROOT=$(python3 -c 'import mujoco, os; print(os.path.dirname(mujoco.__file__))')" >> "$GITHUB_ENV"

      - name: Run tests
        run: just check-ci-mkx
